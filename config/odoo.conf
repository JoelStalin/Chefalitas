[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
db_host = db
db_port = 5432
db_user = odoo
db_password = odoopassword_secure_chefalitas
db_name = chefalitas
proxy_mode = True
; Odoo 20 listens on 127.0.0.1 by default; the container must accept nginx/ORCA traffic
http_interface = 0.0.0.0
workers = 2
max_cron_threads = 1
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
